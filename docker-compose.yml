version: "3.9"

services:

  # ── MySQL database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: solarshield_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: solarshield
      MYSQL_USER: solar
      MYSQL_PASSWORD: solar123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "solar", "-psolar123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker + result backend) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: solarshield_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI application ─────────────────────────────────────────────────────
  api:
    build: .
    container_name: solarshield_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - image_data:/app/images
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://solar:solar123@mysql:3306/solarshield
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery worker ───────────────────────────────────────────────────────────
  worker:
    build: .
    container_name: solarshield_worker
    restart: unless-stopped
    # --pool=solo required on Windows; on Linux use --pool=prefork --concurrency=4
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=solo
    volumes:
      - .:/app
      - image_data:/app/images
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://solar:solar123@mysql:3306/solarshield
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  image_data:
