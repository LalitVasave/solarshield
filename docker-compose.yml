version: "3.9"

services:

  #  PostgreSQL database 
  db:
    image: postgres:15-alpine
    container_name: solarshield_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: solar123
      POSTGRES_DB: solarshield
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solarshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  #  Redis (Celery broker + result backend) 
  redis:
    image: redis:7-alpine
    container_name: solarshield_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  #  FastAPI application 
  api:
    build: .
    container_name: solarshield_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - image_data:/app/images
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://solar:solar123@db:5432/solarshield
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  #  Celery worker 
  worker:
    build: .
    container_name: solarshield_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=solo
    volumes:
      - .:/app
      - image_data:/app/images
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://solar:solar123@db:5432/solarshield
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  image_data:
