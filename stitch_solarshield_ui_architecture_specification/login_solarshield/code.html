<style>
        body {
            background-color: #F8FAFC; /* Level 0 (Floor) from Style Guidance */
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background-color: #FFFFFF; /* Level 1 (Surface) */
            border: 1px solid #E2E8F0;
            box-shadow: 0px 4px 12px rgba(30, 41, 59, 0.05); /* Level 2 (Interactive/Floating) ambient shadow */
        }
        
        /* Modern Input Styling overriding default forms plugin for specific look */
        .ss-input {
            border: 1px solid #E2E8F0;
            background-color: #FFFFFF;
            transition: all 0.2s ease-in-out;
        }
        .ss-input:focus {
            border-color: #0284C7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.1);
            outline: none;
        }

        /* Subtle animated background pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 2px 2px, rgba(30, 41, 59, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
            z-index: -1;
            pointer-events: none;
        }
    </style>

<body class="font-sans text-on-surface antialiased overflow-hidden relative">
<!-- Decorative subtle background -->
<div class="bg-pattern"></div>
<!-- Abstract ambient glow -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-fixed-dim rounded-full blur-[120px] opacity-20 z-[-1] pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-tertiary-fixed-dim rounded-full blur-[150px] opacity-10 z-[-1] pointer-events-none"></div>

<h2 class="font-headline-sm text-headline-sm text-on-surface mb-md">Secure Access</h2>
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Operator ID Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="operator-id">Operator ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">badge</span>
</div>
<input class="ss-input w-full rounded-md font-body-md text-body-md text-on-surface pl-[44px] py-sm" id="operator-id" name="operator-id" placeholder="OP-XXXX" required="" type="text"/>
</div>
</div>
<!-- Access Key Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="access-key">Access Key</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">key</span>
</div>
<input class="ss-input w-full rounded-md font-body-md text-body-md text-on-surface pl-[44px] py-sm" id="access-key" name="access-key" placeholder="••••••••" required="" type="password"/>
</div>
</div>

<span class="w-2 h-2 rounded-full bg-[#10B981]"></span>

</div>

                        Initialize Uplink

</button>
</div>
