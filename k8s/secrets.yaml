apiVersion: v1
kind: Secret
metadata:
  name: solarshield-secrets
  namespace: solarshield
type: Opaque
stringData:
  # In a real cloud environment, these would be managed by AWS Secrets Manager or HashiCorp Vault.
  # Here we use stringData for clarity.
  JWT_SECRET: "supersecretkey"
  JIRA_URL: "https://solarsheild.atlassian.net"
  JIRA_EMAIL: "your-email@example.com"
  JIRA_API_TOKEN: "your_generated_api_token"
  JIRA_PROJECT_KEY: "SCRUM"
